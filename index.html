<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaUnfollow — Instagram Follower Checker</title>
  <meta name="description" content="A modern, secure, and client-side Instagram follower checker to see who doesn't follow you back.">
  <meta name="color-scheme" content="light dark">
  
  <!-- Inline theme check to prevent FOUC (Flash of Unstyled Content) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme === 'dark' ? 'dark' : 'light');
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative background elements -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-logo-row">
        <div class="header-logo">
          <svg viewBox="0 0 24 24" width="32" height="32" class="logo-icon">
            <defs>
              <linearGradient id="insta-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--grad-1)"></stop>
                <stop offset="50%" stop-color="var(--grad-2)"></stop>
                <stop offset="100%" stop-color="var(--grad-3)"></stop>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="url(#insta-gradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke="url(#insta-gradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="url(#insta-gradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></line>
          </svg>
          <h1>shihab</h1>
        </div>
        
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
          <svg id="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="theme-icon">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="theme-icon hidden">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Grid Layout -->
    <main class="app-grid">
      
      <!-- List 1: Following -->
      <section class="card glass" id="card-following">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-num">1</span>
            <h2>Following</h2>
          </div>
          <span class="badge count-badge" id="following-count">0 loaded</span>
        </div>
        <div class="card-body">
          <div class="drop-zone" id="drop-following">
            <textarea id="input-following" placeholder="Paste following text, HTML, or drag & drop followers_and_following/following.html / following.json here..."></textarea>
            <div class="drop-zone-overlay">
              <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>Drop file to load following</span>
            </div>
          </div>
          
          <div class="card-actions">
            <label class="btn btn-secondary btn-sm" for="file-following">
              <input type="file" id="file-following" accept=".html,.json,.txt" class="hidden">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
              Choose File
            </label>
            <button id="clear-following" class="btn btn-tertiary btn-sm">Clear</button>
          </div>

          <div class="parsed-preview-container">
            <button class="preview-toggle" id="toggle-preview-following" disabled>
              <span>Show loaded users</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="parsed-list hidden" id="list-following"></div>
          </div>
        </div>
      </section>

      <!-- List 2: Followers -->
      <section class="card glass" id="card-followers">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-num">2</span>
            <h2>Followers</h2>
          </div>
          <span class="badge count-badge" id="followers-count">0 loaded</span>
        </div>
        <div class="card-body">
          <div class="drop-zone" id="drop-followers">
            <textarea id="input-followers" placeholder="Paste followers text, HTML, or drag & drop followers_and_following/followers.html / followers.json here..."></textarea>
            <div class="drop-zone-overlay">
              <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>Drop file to load followers</span>
            </div>
          </div>

          <div class="card-actions">
            <label class="btn btn-secondary btn-sm" for="file-followers">
              <input type="file" id="file-followers" accept=".html,.json,.txt" class="hidden">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
              Choose File
            </label>
            <button id="clear-followers" class="btn btn-tertiary btn-sm">Clear</button>
          </div>

          <div class="parsed-preview-container">
            <button class="preview-toggle" id="toggle-preview-followers" disabled>
              <span>Show loaded users</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="parsed-list hidden" id="list-followers"></div>
          </div>
        </div>
      </section>

      <!-- List 3: People who don't follow you back -->
      <section class="card glass results-card highlighted-card" id="card-unfollowers">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-num bg-gradient">3</span>
            <h2>Not Following Back</h2>
          </div>
          <span class="badge result-badge" id="unfollowers-count">0 found</span>
        </div>
        
        <div class="card-body">
          <div class="keyboard-hints" id="keyboard-hints">
            <span><kbd>↑</kbd> <kbd>↓</kbd> Select</span>
            <span><kbd>Enter</kbd> Open</span>
            <span><kbd>/</kbd> Search</span>
          </div>

          <div class="results-controls">
            <div class="search-box">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="search-unfollowers" placeholder="Search usernames or names..." disabled>
            </div>
            
            <button id="copy-unfollowers" class="btn btn-primary btn-sm" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Copy List</span>
            </button>
          </div>

          <div class="results-container">
            <div class="empty-state" id="unfollowers-empty-state">
              <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="18" y1="8" x2="23" y2="13"></line>
                <line x1="23" y1="8" x2="18" y2="13"></line>
              </svg>
              <p class="empty-title">Waiting for data</p>
              <p class="empty-desc">Input your Following and Followers lists on the left to find who doesn't follow you back.</p>
            </div>
            <div class="results-list hidden" id="list-unfollowers"></div>
          </div>

          <div class="parsed-preview-container">
            <button class="preview-toggle" id="toggle-preview-unfollowed" disabled>
              <span>Show unfollowed users</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="parsed-list hidden" id="list-unfollowed"></div>
          </div>
        </div>
      </section>

    </main>

  </div>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
